name: Compile and Auto-Release

on:
  push:
    branches:
      - main
    paths:
      - '**.py'

jobs:
  build-and-release-arm:
    runs-on: ubuntu-22.04-arm 
    
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch 

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14' 

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc patchelf build-essential

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          pip install -r src/requirements.txt 

      - name: Inject Version Number
        run: |
          echo "__version__ = '${{ steps.tag_version.outputs.new_tag }}'" > src/version.py
          cat src/version.py

      - name: Compile Python to C
        run: |
          # 1. Download the JSON files directly to the GitHub runner workspace
          curl -o board_imports.json https://raw.githubusercontent.com/adafruit/Adafruit_Blinka/main/src/board_imports.json
          curl -o microcontroller_imports.json https://raw.githubusercontent.com/adafruit/Adafruit_Blinka/main/src/microcontroller_imports.json
          
          # 2. Compile Nuitka
          python -m nuitka --standalone \
            --output-filename=goblin-speaks \
            --include-package=adafruit_blinka \
            --include-package=adafruit_servokit \
            --include-package=RPi \
            --include-package=lgpio \
            --include-package=gpiozero \
            --include-package=typer \
            --include-module=pygame \
            --include-module=yaml \
            --output-dir=build \
            src/main.py
            
          # 3. Force copy the files to the correct main.dist folder
          cp board_imports.json build/main.dist/
          cp microcontroller_imports.json build/main.dist/
          
          # 4. Create the required subfolder and copy the file inside it
          mkdir -p build/main.dist/microcontroller
          cp microcontroller_imports.json build/main.dist/microcontroller/

      - name: Package as .deb
        run: |
          TAG="${{ steps.tag_version.outputs.new_tag }}"
          TAG_CLEAN="${TAG#v}"
          PKG_NAME="goblin-speaks_${TAG_CLEAN}_arm64"
          PKG_DIR="$PKG_NAME"
          APP_DEST="$PKG_DIR/opt/goblin-speaks"
          
          # 1. Create package staging directory structure
          mkdir -p "$APP_DEST"
          mkdir -p "$PKG_DIR/home/goblin/goblin-speaks"
          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/lib/systemd/system"
          
          # 2. Copy compiled binary and all shared libs into package
          cp -r build/main.dist/. "$APP_DEST/"
          
          # 3. Copy the launcher script to the data directory
          cp linux/launcher.sh "$PKG_DIR/home/goblin/goblin-speaks/launcher.sh"
          
          # 4. Copy the systemd service file
          cp linux/goblin.service "$PKG_DIR/usr/lib/systemd/system/goblin.service"
          
          # 5. Write control file with correct version (strip leading 'v' for Debian compliance)
          sed "s/^Version: .*/Version: ${TAG_CLEAN}/" linux/debian/control > "$PKG_DIR/DEBIAN/control"
          
          # 6. Copy and chmod maintainer scripts
          cp linux/debian/postinst "$PKG_DIR/DEBIAN/postinst"
          cp linux/debian/prerm    "$PKG_DIR/DEBIAN/prerm"
          cp linux/debian/postrm   "$PKG_DIR/DEBIAN/postrm"
          chmod 755 "$PKG_DIR/DEBIAN/postinst" "$PKG_DIR/DEBIAN/prerm" "$PKG_DIR/DEBIAN/postrm"
          
          # 7. Build the .deb
          dpkg-deb --build "$PKG_DIR" "${PKG_NAME}.deb"
          echo "DEB_FILE=${PKG_NAME}.deb" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          files: ${{ env.DEB_FILE }}
          prerelease: true
          generate_release_notes: true