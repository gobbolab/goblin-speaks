name: Compile and Auto-Release

on:
  push:
    branches:
      - main
    paths:
      - '**.py'

jobs:
  build-and-release-arm:
    runs-on: ubuntu-22.04-arm 
    
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc patchelf build-essential

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          pip install -r src/requirements.txt 

      - name: Inject Version Number
        run: |
          echo "__version__ = '${{ steps.tag_version.outputs.new_tag }}'" > src/version.py
          cat src/version.py

      - name: Compile Python to C
        run: |
          # 1. Find exactly where pip installed adafruit_blinka on the runner
          BLINKA_DIR=$(python -c "import adafruit_blinka; import os; print(os.path.dirname(adafruit_blinka.__file__))")
          
          # 2. Curl the files DIRECTLY into that Python library folder
          curl -o $BLINKA_DIR/board_imports.json https://raw.githubusercontent.com/adafruit/Adafruit_Blinka/main/src/board_imports.json
          curl -o $BLINKA_DIR/microcontroller_imports.json https://raw.githubusercontent.com/adafruit/Adafruit_Blinka/main/src/microcontroller_imports.json
          
          # 3. Tell Nuitka to grab the entire package and its data natively
          python -m nuitka --standalone \
            --output-filename=goblin-speaks \
            --include-package=adafruit_blinka \
            --include-package=adafruit_servokit \
            --include-package=RPi \
            --include-package=typer \
            --include-module=pygame \
            --include-package-data=adafruit_blinka \
            --output-dir=build \
            src/main.py

      - name: Compress Build
        run: |
          # Compress the directory into a tarball
          tar -czvf goblin-app.tar.gz -C build/main.dist .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          files: goblin-app.tar.gz
          generate_release_notes: true