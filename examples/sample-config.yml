# Optional: custom plugins directory (default: ~/.goblin-speaks/plugins)
# plugins:
#   directory: ~/.goblin-speaks/plugins

activators:
  fortune_button:
    type: gpiozero_button
    sequence: fortune
    trigger_pin: 21
  greeting_sensor:
    type: gpiozero_button
    sequence: greeting
    trigger_pin: 17

audio_player:
  sound_banks:
    pre_fortune:
      mode: random
    fortune:
      mode: sequential
    post_fortune:
      mode: random
    activation:
      mode: random

components:
  goblin_body:
    type: animatronic
    class: gs_body
  card_dispenser:
    type: dispenser
    class: single_stepper
    dispense_steps: 2048
    step_delay: 0.0015

sequences:
  fortune:
    - component: audio
      action: play_sequence
      args:
        sound_types: [pre_fortune, fortune, post_fortune]
      output: duration
    - component: goblin_body
      action: animate
      args:
        duration: $duration
    - component: card_dispenser
      action: dispense
  greeting:
    - component: audio
      action: play
      args:
        bank_name: activation

